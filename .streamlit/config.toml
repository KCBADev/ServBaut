# Configuración de Streamlit — Auto Servicio Bautista

[theme]
# Tablero oscuro tipo panel de control. El lienzo y las tarjetas son dos
# azules-carbón distintos para que una tarjeta se distinga del fondo sin
# necesitar borde, y el verde menta queda para lo que importa: cifras,
# botones y estados activos. `styles.py` tiene el detalle completo.
primaryColor = "#18D59C"              # verde menta: acento principal
backgroundColor = "#091017"           # azul marino / carbón: lienzo
secondaryBackgroundColor = "#171B24"  # gris azulado: tarjetas y campos
textColor = "#D2D8DE"                 # gris claro de alto contraste
font = "sans serif"

[server]
# Escucha en toda interfaz de red, no solo en esta computadora: así se puede
# entrar desde celulares/tablets/laptops en el mismo Wi-Fi del taller
# (http://<IP local>:8501). Sigue siendo HTTP sin cifrar, así que esto vale
# SOLO dentro de una red de confianza — nunca abrir el puerto hacia internet
# (router/port-forwarding) con esta configuración.
address = "0.0.0.0"
port = 8501
headless = true

# Aplica los cambios de código sin preguntar. Sin esto, en cuanto un archivo
# .py cambia, Streamlit muestra arriba «File change / Rerun / Always rerun»
# y se queda esperando. Eso es una comodidad para quien programa, no para
# quien captura notas en el taller.
runOnSave = true

[client]
# Esconde la barra de desarrollo: el botón «Deploy», el menú de hamburguesa y
# el aviso de archivo modificado. El taller no despliega nada ni edita código;
# esos controles solo estorban y se pueden picar por error.
toolbarMode = "minimal"

# Si un error no capturado llega a pantalla, se muestra solo el TIPO de
# excepción, no el traceback completo (rutas de archivo, nombres internos).
# Hoy el servidor solo escucha en localhost, pero el README ya documenta cómo
# abrirlo a la red del taller — y ese es el escenario donde un traceback
# completo sí quedaría visible a cualquiera en esa red.
showErrorDetails = "type"

[browser]
gatherUsageStats = false
